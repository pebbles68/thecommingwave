# Integración continua (ajuste AJ-010): instalación limpia, validaciones de
# datos y motores (`npm test`) y pruebas E2E con navegador real
# (`npm run test:e2e`) en la versión mínima soportada de Node y en la LTS
# vigente. Bloquea cambios con datos inválidos, referencias rotas o
# regresiones de interfaz.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalación limpia
        run: npm ci
      - name: Validaciones de datos, motores y servidor
        run: npm test
      # Playwright 1.63 exige Node 20 o superior: el E2E solo corre en la LTS vigente; Node 18 valida datos y motores.
      - name: Generar la web estática
        run: npm run build
      - name: Instalar Chromium para Playwright
        if: matrix.node != '18'
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E (tablet horizontal y humo táctil)
        if: matrix.node != '18'
        run: npm run test:e2e -- --workers=1
      - name: Resultados de Playwright si falla
        if: failure() && matrix.node != '18'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
